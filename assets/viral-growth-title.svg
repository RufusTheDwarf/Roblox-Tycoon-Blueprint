
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="230"
     viewBox="0 0 1200 230"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Viral Growth - Section 14</title>
  <desc id="desc">Animated red and blue title for the Viral Growth section of Roblox Tycoon Blueprint.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10151D"/>
      <stop offset="55%" stop-color="#171D27"/>
      <stop offset="100%" stop-color="#0B111A"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2231A"/>
      <stop offset="48%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#1685E8"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2231A" stop-opacity="0"/>
      <stop offset="25%" stop-color="#E2231A"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#1685E8"/>
      <stop offset="100%" stop-color="#1685E8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="redGlow">
      <stop offset="0%" stop-color="#E2231A" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#E2231A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#1685E8" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#1685E8" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36"
            fill="none"
            stroke="#8DA4C0"
            stroke-opacity=".07"
            stroke-width="1"/>
    </pattern>

    <clipPath id="panel">
      <rect width="1200" height="230" rx="15"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1200" height="230" fill="url(#background)"/>
    <rect width="1200" height="230" fill="url(#grid)"/>

    <ellipse cx="150" cy="110" rx="270" ry="180" fill="url(#redGlow)">
      <animate attributeName="opacity"
               values=".55;1;.55"
               dur="5s"
               repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="1050" cy="120" rx="280" ry="190" fill="url(#blueGlow)">
      <animate attributeName="opacity"
               values="1;.5;1"
               dur="5s"
               repeatCount="indefinite"/>
    </ellipse>

    <!-- Network paths -->
    <g fill="none" stroke-width="2" opacity=".7">
      <path d="M0 65H115L145 95H220"
            stroke="#E2231A"/>
      <path d="M0 78H95L125 108H185"
            stroke="#E2231A"
            opacity=".45"/>
      <path d="M1200 65H1085L1055 95H980"
            stroke="#1685E8"/>
      <path d="M1200 78H1105L1075 108H1015"
            stroke="#1685E8"
            opacity=".45"/>
    </g>

    <!-- Network nodes -->
    <g fill="#E2231A">
      <circle cx="220" cy="95" r="4">
        <animate attributeName="r"
                 values="3;5;3"
                 dur="2s"
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="185" cy="108" r="2.5"/>
    </g>

    <g fill="#1685E8">
      <circle cx="980" cy="95" r="4">
        <animate attributeName="r"
                 values="5;3;5"
                 dur="2s"
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="1015" cy="108" r="2.5"/>
    </g>

    <!-- Connected player nodes -->
    <g fill="none" stroke-width="1.5" opacity=".65">
      <path d="M90 145L125 125L160 145"
            stroke="#E2231A"/>
      <path d="M1040 145L1075 125L1110 145"
            stroke="#1685E8"/>
    </g>

    <g fill="#E2231A">
      <circle cx="90" cy="145" r="5"/>
      <circle cx="125" cy="125" r="5"/>
      <circle cx="160" cy="145" r="5"/>
    </g>

    <g fill="#1685E8">
      <circle cx="1040" cy="145" r="5"/>
      <circle cx="1075" cy="125" r="5"/>
      <circle cx="1110" cy="145" r="5"/>
    </g>

    <!-- Section label -->
    <text x="600"
          y="55"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="13"
          font-weight="700"
          letter-spacing="4"
          fill="#AAB8CA">
      ROBLOX TYCOON BLUEPRINT
    </text>

    <!-- Main title -->
    <text x="600"
          y="125"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="64"
          font-weight="900"
          letter-spacing="2"
          fill="url(#titleGradient)"
          filter="url(#glow)">
      VIRAL GROWTH
    </text>

    <!-- Moving shine -->
    <rect x="180"
          y="72"
          width="100"
          height="65"
          fill="#FFFFFF"
          opacity="0"
          transform="skewX(-25)">
      <animate attributeName="x"
               values="180;1000;180"
               dur="7s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="0;.12;0"
               dur="7s"
               repeatCount="indefinite"/>
    </rect>

    <!-- Subtitle -->
    <text x="600"
          y="160"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="15"
          font-weight="600"
          letter-spacing="3"
          fill="#D5DFEA">
      SECTION 14 / ORGANIC GROWTH &amp; COMMUNITY
    </text>

    <!-- Animated separator -->
    <rect x="250"
          y="184"
          width="700"
          height="2"
          rx="1"
          fill="url(#lineGradient)">
      <animate attributeName="opacity"
               values=".5;1;.5"
               dur="3s"
               repeatCount="indefinite"/>
    </rect>

    <circle cx="250" cy="185" r="3" fill="#E2231A">
      <animate attributeName="cx"
               values="250;950;250"
               dur="6s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="950" cy="185" r="3" fill="#1685E8">
      <animate attributeName="cx"
               values="950;250;950"
               dur="6s"
               repeatCount="indefinite"/>
    </circle>

    <!-- Bottom metadata -->
    <text x="600"
          y="211"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="10"
          font-weight="700"
          letter-spacing="2"
          fill="#788BA3">
      SHARE / CONNECT / DISCOVER
    </text>

    <!-- Corner accents -->
    <path d="M20 20H65M20 20V45"
          fill="none"
          stroke="#E2231A"
          stroke-width="2"/>

    <path d="M1180 20H1135M1180 20V45"
          fill="none"
          stroke="#1685E8"
          stroke-width="2"/>

    <path d="M20 210H65M20 210V185"
          fill="none"
          stroke="#E2231A"
          stroke-width="2"
          opacity=".7"/>

    <path d="M1180 210H1135M1180 210V185"
          fill="none"
          stroke="#1685E8"
          stroke-width="2"
          opacity=".7"/>
  </g>
</svg>
