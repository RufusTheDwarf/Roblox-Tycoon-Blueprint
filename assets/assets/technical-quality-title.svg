
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Technical Quality</title>
  <desc id="desc">Animated red and blue technical title for section 19 of Roblox Tycoon Blueprint.</desc>

  <defs>
    <linearGradient id="technicalGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2231A"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#1685E8"/>
    </linearGradient>
    <linearGradient id="technicalLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2231A" stop-opacity="0"/>
      <stop offset="20%" stop-color="#E2231A"/>
      <stop offset="80%" stop-color="#1685E8"/>
      <stop offset="100%" stop-color="#1685E8" stop-opacity="0"/>
    </linearGradient>
    <filter id="technicalGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="technicalShineClip">
      <text x="600" y="91" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" letter-spacing="3">TECHNICAL QUALITY</text>
    </clipPath>
  </defs>

  <rect width="1200" height="190" rx="12" fill="#10151D"/>
  <path d="M0 24 H1200 M0 166 H1200" stroke="#393B3D" stroke-width="1" opacity=".65"/>

  <path d="M38 35 H190 M1010 35 H1162" stroke="#E2231A" stroke-width="2" opacity=".8"/>
  <path d="M38 155 H190 M1010 155 H1162" stroke="#1685E8" stroke-width="2" opacity=".8"/>

  <g fill="none" stroke="#1685E8" stroke-width="1.5" opacity=".28">
    <path d="M95 78 H155 V105 H190"/>
    <path d="M1105 78 H1045 V105 H1010"/>
    <path d="M95 78 L110 63 L125 78"/>
    <path d="M1105 78 L1090 63 L1075 78"/>
    <circle cx="95" cy="78" r="4" fill="#1685E8"/>
    <circle cx="1105" cy="78" r="4" fill="#1685E8"/>
  </g>

  <g filter="url(#technicalGlow)">
    <text x="600" y="91" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" letter-spacing="3" fill="url(#technicalGradient)">TECHNICAL QUALITY</text>
  </g>

  <g clip-path="url(#technicalShineClip)" opacity=".55">
    <rect x="-260" y="20" width="150" height="90" fill="#FFFFFF" opacity=".2" transform="skewX(-22)">
      <animate attributeName="x" values="-260;1320" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="600" y="127" text-anchor="middle" fill="#AEB8C5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4">SECTION 19 / SECURITY &amp; RELIABILITY</text>

  <rect x="250" y="145" width="700" height="2" rx="1" fill="url(#technicalLine)">
    <animate attributeName="opacity" values=".35;1;.35" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="250" cy="146" r="3" fill="#E2231A">
    <animate attributeName="opacity" values=".3;1;.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="146" r="3" fill="#1685E8">
    <animate attributeName="opacity" values="1;.3;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="178" text-anchor="middle" fill="#667386" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3">ROBLOX TYCOON BLUEPRINT</text>
</svg>
