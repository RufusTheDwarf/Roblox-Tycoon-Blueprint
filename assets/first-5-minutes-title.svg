
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">First 5 Minutes</title>
  <desc id="desc">Animated red and blue title for section 02 of Roblox Tycoon Blueprint.</desc>

  <defs>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2231A"/>
      <stop offset="48%" stop-color="#F4F4F4"/>
      <stop offset="100%" stop-color="#1685E8"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="textClip">
      <text x="600" y="105" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="68" font-weight="900" letter-spacing="5">
        FIRST 5 MINUTES
      </text>
    </clipPath>
  </defs>

  <path d="M90 25 H1110" stroke="#393B3D" stroke-width="1" opacity=".8"/>
  <path d="M90 160 H1110" stroke="#393B3D" stroke-width="1" opacity=".8"/>

  <path d="M90 25 H310" stroke="#E2231A" stroke-width="3">
    <animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M890 160 H1110" stroke="#1685E8" stroke-width="3">
    <animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/>
  </path>

  <text x="600" y="105" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="68" font-weight="900" letter-spacing="5"
    fill="url(#titleGradient)" filter="url(#glow)">
    FIRST 5 MINUTES
    <animate attributeName="opacity" values=".45;1;1" dur="1.6s" fill="freeze"/>
  </text>

  <g clip-path="url(#textClip)">
    <rect x="-300" y="15" width="180" height="110" fill="url(#shine)" opacity=".55">
      <animate attributeName="x" from="-300" to="1300" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path d="M330 133 H870" stroke="#393B3D" stroke-width="3" stroke-linecap="round"/>
  <path d="M330 133 H330" stroke="#E2231A" stroke-width="4" stroke-linecap="round">
    <animate attributeName="d" values="M330 133 H330;M330 133 H870;M330 133 H330" dur="4s" repeatCount="indefinite"/>
  </path>

  <circle cx="300" cy="133" r="4" fill="#E2231A">
    <animate attributeName="opacity" values=".3;1;.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="133" r="4" fill="#1685E8">
    <animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="178" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15" font-weight="700" letter-spacing="5"
    fill="#AEB8C2">
    SECTION 02 / PLAYER ONBOARDING
  </text>
</svg>
