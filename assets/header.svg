<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">

  <title id="title">Roblox Tycoon Blueprint - Ultimate Edition</title>
  <desc id="desc">Next-gen animated technical banner featuring high-detail isometric red and blue Roblox blocks, advanced tycoon production core, holographic blueprint grid, and cinematic neon lighting.</desc>

  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F" />
      <stop offset="40%" stop-color="#0E1420" />
      <stop offset="80%" stop-color="#162235" />
      <stop offset="100%" stop-color="#1D2A40" />
    </linearGradient>

    <linearGradient id="redBlockTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A52" />
      <stop offset="100%" stop-color="#E51C23" />
    </linearGradient>
    <linearGradient id="redBlockLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#9A0007" />
    </linearGradient>
    <linearGradient id="redBlockRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B71C1C" />
      <stop offset="100%" stop-color="#67000B" />
    </linearGradient>

    <linearGradient id="blueBlockTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E9FFF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="blueBlockLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1976D2" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
    <linearGradient id="blueBlockRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#002171" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CFD8DC" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0083B0" />
    </linearGradient>

    <linearGradient id="lightSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity=".18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlowRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur1" />
      <feGaussianBlur stdDeviation="30" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur1" />
      <feGaussianBlur stdDeviation="30" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>

    <!-- Patterns -->
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00E5FF" stroke-opacity="0.04" stroke-width="1" />
      <circle cx="60" cy="0" r="1.5" fill="#00E5FF" fill-opacity="0.15" />
    </pattern>

    <clipPath id="bannerClip">
      <rect width="1600" height="360" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Background & Grid -->
    <rect width="1600" height="360" fill="url(#bgGrad)" />
    <rect width="1600" height="360" fill="url(#gridPattern)" />

    <!-- Blueprint Architectural Lines & HUD elements -->
    <g fill="none" stroke="#00E5FF" stroke-opacity="0.12" stroke-width="1">
      <path d="M-100 320 L1700 140" />
      <path d="M-100 360 L1700 180" />
      <path d="M1100 0 V360" />
      <path d="M1260 0 V360" />
      <path d="M1420 0 V360" />
      <!-- HUD Target Crosshairs -->
      <g transform="translate(1480, 80)" stroke-opacity="0.3">
        <circle cx="0" cy="0" r="25" />
        <circle cx="0" cy="0" r="5" fill="#00E5FF" fill-opacity="0.3" />
        <path d="M-35 0 H-10 M10 0 H35 M0 -35 V-10 M0 10 V35" />
      </g>
      <g transform="translate(1040, 280)" stroke-opacity="0.25">
        <circle cx="0" cy="0" r="35" />
        <path d="M-45 0 H-15 M15 0 H45 M0 -45 V-15 M0 15 V45" />
      </g>
    </g>

    <!-- Ambient Glows -->
    <circle cx="1320" cy="90" r="130" fill="#FF1744" opacity="0.15" filter="url(#neonGlowRed)">
      <animate attributeName="opacity" values="0.1;0.22;0.1" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1500" cy="270" r="140" fill="#00E5FF" opacity="0.18" filter="url(#neonGlowBlue)">
      <animate attributeName="opacity" values="0.12;0.28;0.12" dur="5s" repeatCount="indefinite" />
    </circle>

    <!-- Animated Light Sweep -->
    <rect x="-600" y="0" width="600" height="360" fill="url(#lightSweep)" opacity="0.8">
      <animate attributeName="x" values="-600;1800" dur="7s" repeatCount="indefinite" />
    </rect>

    <!-- Background Blueprint Structures / Sci-Fi Panels -->
    <g opacity="0.75">
      <path d="M-20 280 L180 230 L180 360 L-20 360 Z" fill="#0A111A" stroke="#00E5FF" stroke-opacity="0.2" stroke-width="1.5" />
      <path d="M-20 305 L180 255" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="3" />
      <path d="M20 330 L180 295" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />
    </g>

    <!-- Floating Isometric Blocks -->
    <g filter="url(#subtleShadow)">
      <!-- Block 1: Blue Top Right -->
      <g transform="translate(1220, 50)">
        <animateTransform attributeName="transform" type="translate" values="1220 50; 1220 36; 1220 50" dur="5s" repeatCount="indefinite" />
        <!-- Top Face -->
        <path d="M0 26 L56 0 L112 26 L56 52 Z" fill="url(#blueBlockTop)" />
        <!-- Left Face -->
        <path d="M0 26 V86 L56 112 V52 Z" fill="url(#blueBlockLeft)" />
        <!-- Right Face -->
        <path d="M56 52 V112 L112 86 V26 Z" fill="url(#blueBlockRight)" />
        <!-- Studs -->
        <ellipse cx="40" cy="21" rx="8" ry="4" fill="#64B5F6" opacity="0.7" />
        <ellipse cx="72" cy="21" rx="8" ry="4" fill="#64B5F6" opacity="0.7" />
      </g>

      <!-- Block 2: Red Center -->
      <g transform="translate(1380, 145)">
        <animateTransform attributeName="transform" type="translate" values="1380 145; 1380 162; 1380 145" dur="6s" repeatCount="indefinite" />
        <!-- Top Face -->
        <path d="M0 22 L46 0 L92 22 L46 44 Z" fill="url(#redBlockTop)" />
        <!-- Left Face -->
        <path d="M0 22 V72 L46 94 V44 Z" fill="url(#redBlockLeft)" />
        <!-- Right Face -->
        <path d="M46 44 V94 L92 72 V22 Z" fill="url(#redBlockRight)" />
        <!-- Stud -->
        <ellipse cx="46" cy="18" rx="7" ry="3.5" fill="#FF8A80" opacity="0.8" />
      </g>

      <!-- Block 3: Small Red Back -->
      <g transform="translate(1080, 205)" opacity="0.7">
        <path d="M0 16 L32 0 L64 16 L32 32 Z" fill="url(#redBlockTop)" />
        <path d="M0 16 V52 L32 68 V32 Z" fill="url(#redBlockLeft)" />
        <path d="M32 32 V68 L64 52 V16 Z" fill="url(#redBlockRight)" />
      </g>
    </g>

    <!-- Tycoon Production Core / Machine -->
    <g transform="translate(1290, 210)" filter="url(#subtleShadow)">
      <!-- Base Chassis -->
      <path d="M0 40 L105 0 L210 40 V120 L105 160 L0 120 Z" fill="#0D131F" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="2" />
      <path d="M0 40 L105 80 L210 40" fill="none" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1.5" />
      <path d="M105 80 V160" fill="none" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1.5" />

      <!-- Glowing Reactor Vent -->
      <rect x="60" y="32" width="90" height="46" rx="6" fill="#FF1744" opacity="0.9" filter="url(#neonGlowRed)" />
      <circle cx="105" cy="55" r="14" fill="#FFFFFF">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
      </circle>

      <!-- Energy Output Node -->
      <path d="M105 80 V110" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" filter="url(#neonGlowBlue)" />
      <circle cx="105" cy="120" r="10" fill="#00E5FF" filter="url(#neonGlowBlue)">
        <animate attributeName="r" values="8;13;8" dur="1.8s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Conveyor Belt System -->
    <g transform="translate(1080, 320)" opacity="0.9">
      <path d="M0 0 L460 -75" stroke="#0066FF" stroke-width="10" stroke-linecap="round" filter="url(#neonGlowBlue)" />
      <path d="M0 0 L460 -75" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3" stroke-dasharray="16 20">
        <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="1.5s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Main Typography & UI Area -->
    <g transform="translate(110, 0)">
      
      <!-- Glassmorphism Workshop Badge -->
      <g transform="translate(0, 55)">
        <rect width="246" height="34" rx="8" fill="#0D1424" fill-opacity="0.85" stroke="#FF1744" stroke-opacity="0.6" stroke-width="1.5" filter="url(#subtleShadow)" />
        <!-- Little glowing dot -->
        <circle cx="18" cy="17" r="5" fill="#FF1744">
          <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
        </circle>
        <text x="36" y="22" fill="#FFFFFF" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2.5">
          THE CREATOR'S WORKSHOP
        </text>
      </g>

      <!-- Main Title: ROBLOX TYCOON -->
      <text x="0" y="162" fill="url(#titleGrad)" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="1.5" filter="url(#subtleShadow)">
        ROBLOX TYCOON
      </text>

      <!-- Blueprint Subtitle -->
      <text x="4" y="220" fill="url(#cyanGrad)" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="10" filter="url(#neonGlowBlue)">
        BLUEPRINT
      </text>

      <!-- Animated Underline Accent -->
      <rect x="4" y="238" width="410" height="5" rx="2.5" fill="#FF1744" filter="url(#neonGlowRed)">
        <animate attributeName="width" values="120;410;120" dur="4.5s" repeatCount="indefinite" />
      </rect>

      <!-- Tagline -->
      <text x="4" y="280" fill="#90CAF9" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">
        DESIGN <tspan fill="#FF5A52">∕</tspan> BUILD <tspan fill="#FF5A52">∕</tspan> TEST <tspan fill="#FF5A52">∕</tspan> IMPROVE
      </text>

    </g>

    <!-- Top Right Status HUD -->
    <g transform="translate(1350, 32)">
      <rect width="180" height="30" rx="6" fill="#0D1424" fill-opacity="0.85" stroke="#00E5FF" stroke-opacity="0.3" />
      <circle cx="16" cy="15" r="5" fill="#00E676" filter="url(#neonGlowBlue)">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="19" fill="#E0F7FA" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">
        SYSTEM ONLINE
      </text>
    </g>

    <!-- Sleek Bottom Borders -->
    <rect x="0" y="352" width="1600" height="8" fill="#FF1744" />
    <rect x="0" y="352" width="580" height="8" fill="#0066FF" />

  </g>
</svg>
