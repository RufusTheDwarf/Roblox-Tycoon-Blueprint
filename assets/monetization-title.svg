
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="230"
     viewBox="0 0 1200 230"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Monetization - Section 13</title>
  <desc id="desc">Animated red and blue title for the monetization section of Roblox Tycoon Blueprint.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10151D"/>
      <stop offset="55%" stop-color="#171D27"/>
      <stop offset="100%" stop-color="#0B111A"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2231A"/>
      <stop offset="45%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#1685E8"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2231A" stop-opacity="0"/>
      <stop offset="25%" stop-color="#E2231A"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#1685E8"/>
      <stop offset="100%" stop-color="#1685E8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="redGlow">
      <stop offset="0%" stop-color="#E2231A" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#E2231A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#1685E8" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#1685E8" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36"
            fill="none"
            stroke="#8DA4C0"
            stroke-opacity=".07"
            stroke-width="1"/>
    </pattern>

    <clipPath id="panel">
      <rect x="0" y="0" width="1200" height="230" rx="15"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1200" height="230" fill="url(#background)"/>
    <rect width="1200" height="230" fill="url(#grid)"/>

    <ellipse cx="140" cy="105" rx="260" ry="180" fill="url(#redGlow)">
      <animate attributeName="opacity"
               values=".65;1;.65"
               dur="5s"
               repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="1080" cy="130" rx="270" ry="190" fill="url(#blueGlow)">
      <animate attributeName="opacity"
               values="1;.55;1"
               dur="5s"
               repeatCount="indefinite"/>
    </ellipse>

    <!-- Decorative circuit lines -->
    <g fill="none" stroke-width="2" opacity=".65">
      <path d="M0 45H120L145 70H205"
            stroke="#E2231A"/>
      <path d="M0 55H105L130 80H175"
            stroke="#E2231A"
            opacity=".45"/>
      <path d="M1200 45H1080L1055 70H995"
            stroke="#1685E8"/>
      <path d="M1200 55H1095L1070 80H1025"
            stroke="#1685E8"
            opacity=".45"/>
    </g>

    <g fill="#E2231A">
      <circle cx="205" cy="70" r="3">
        <animate attributeName="opacity"
                 values=".35;1;.35"
                 dur="2s"
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="175" cy="80" r="2"/>
    </g>

    <g fill="#1685E8">
      <circle cx="995" cy="70" r="3">
        <animate attributeName="opacity"
                 values="1;.3;1"
                 dur="2.5s"
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="1025" cy="80" r="2"/>
    </g>

    <!-- Section label -->
    <g font-family="Arial, Helvetica, sans-serif"
       font-size="13"
       font-weight="700"
       letter-spacing="4"
       fill="#AAB8CA">
      <text x="600" y="55" text-anchor="middle">
        ROBLOX TYCOON BLUEPRINT
      </text>
    </g>

    <!-- Main title -->
    <text x="600"
          y="125"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="62"
          font-weight="900"
          letter-spacing="2"
          fill="url(#titleGradient)"
          filter="url(#glow)">
      MONETIZATION
    </text>

    <!-- Moving shine -->
    <rect x="220"
          y="70"
          width="90"
          height="65"
          fill="#FFFFFF"
          opacity="0"
          transform="skewX(-25)">
      <animate attributeName="x"
               values="220;1000;220"
               dur="7s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="0;.12;0"
               dur="7s"
               repeatCount="indefinite"/>
    </rect>

    <!-- Subtitle -->
    <text x="600"
          y="160"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="15"
          font-weight="600"
          letter-spacing="3"
          fill="#D5DFEA">
      SECTION 13 / FAIR &amp; TRANSPARENT REVENUE
    </text>

    <!-- Animated separator -->
    <rect x="250"
          y="184"
          width="700"
          height="2"
          rx="1"
          fill="url(#lineGradient)">
      <animate attributeName="opacity"
               values=".55;1;.55"
               dur="3s"
               repeatCount="indefinite"/>
    </rect>

    <circle cx="250" cy="185" r="3" fill="#E2231A">
      <animate attributeName="cx"
               values="250;950;250"
               dur="6s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="950" cy="185" r="3" fill="#1685E8">
      <animate attributeName="cx"
               values="950;250;950"
               dur="6s"
               repeatCount="indefinite"/>
    </circle>

    <!-- Bottom metadata -->
    <g font-family="Arial, Helvetica, sans-serif"
       font-size="10"
       font-weight="700"
       letter-spacing="2"
       fill="#788BA3">
      <text x="600" y="211" text-anchor="middle">
        DESIGN / ECONOMY / PLAYER EXPERIENCE
      </text>
    </g>

    <!-- Corner accents -->
    <path d="M20 20H65M20 20V45"
          fill="none"
          stroke="#E2231A"
          stroke-width="2"/>

    <path d="M1180 20H1135M1180 20V45"
          fill="none"
          stroke="#1685E8"
          stroke-width="2"/>

    <path d="M20 210H65M20 210V185"
          fill="none"
          stroke="#E2231A"
          stroke-width="2"
          opacity=".7"/>

    <path d="M1180 210H1135M1180 210V185"
          fill="none"
          stroke="#1685E8"
          stroke-width="2"
          opacity=".7"/>
  </g>
</svg>
