
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Economy Design</title>
  <desc id="desc">Animated red and blue title for section 05 of Roblox Tycoon Blueprint.</desc>

  <defs>
    <linearGradient id="economyGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2231A">
        <animate attributeName="stop-color" values="#E2231A;#FF5148;#E2231A" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#1685E8">
        <animate attributeName="stop-color" values="#1685E8;#55B4FF;#1685E8" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="economyLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2231A" stop-opacity="0"/>
      <stop offset="25%" stop-color="#E2231A"/>
      <stop offset="75%" stop-color="#1685E8"/>
      <stop offset="100%" stop-color="#1685E8" stop-opacity="0"/>
    </linearGradient>

    <filter id="economyGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="economyGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1685E8" stroke-opacity=".12" stroke-width="1"/>
    </pattern>

    <clipPath id="economyClip">
      <rect x="0" y="0" width="1200" height="190" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#economyClip)">
    <rect width="1200" height="190" rx="12" fill="#10151D"/>
    <rect width="1200" height="190" fill="url(#economyGrid)"/>

    <path d="M0 30 H1200 M0 160 H1200" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="1"/>

    <g fill="none" stroke="#1685E8" stroke-opacity=".3" stroke-width="1.5">
      <path d="M35 95 H180 L205 70 H280"/>
      <path d="M920 120 H1000 L1025 95 H1165"/>
      <path d="M75 145 H145 L165 125 H205"/>
      <path d="M1010 45 H1080 L1100 65 H1170"/>
    </g>

    <g fill="#1685E8" opacity=".55">
      <circle cx="180" cy="95" r="3"/>
      <circle cx="280" cy="70" r="3"/>
      <circle cx="1000" cy="120" r="3"/>
      <circle cx="1165" cy="95" r="3"/>
    </g>

    <g transform="translate(600 67)" text-anchor="middle">
      <text
        font-family="Arial, Helvetica, sans-serif"
        font-size="49"
        font-weight="900"
        letter-spacing="2"
        fill="url(#economyGradient)"
        filter="url(#economyGlow)">
        ECONOMY DESIGN
      </text>

      <rect x="-220" y="14" width="440" height="2" rx="1" fill="url(#economyLine)">
        <animate attributeName="width" values="360;440;360" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="x" values="-180;-220;-180" dur="4s" repeatCount="indefinite"/>
      </rect>

      <text
        y="48"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        font-weight="700"
        letter-spacing="4"
        fill="#B9C7D8">
        SECTION 05 / ECONOMIC BALANCE
      </text>
    </g>

    <g transform="translate(600 145)" fill="none" stroke-width="2">
      <path d="M-85 0 H85" stroke="url(#economyLine)" stroke-linecap="round"/>
      <circle cx="-100" cy="0" r="3" fill="#E2231A" stroke="none">
        <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="0" r="3" fill="#1685E8" stroke="none">
        <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <path d="M0 185 H1200" stroke="url(#economyLine)" stroke-width="4"/>
  </g>
</svg>
